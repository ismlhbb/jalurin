# ============================================================
# Jalurin — Cloudflare Pages Deploy (best practice)
# ============================================================
# Deploy otomatis setiap push ke main. Build pakai pnpm,
# output `.dist` dikirim ke Cloudflare Pages via wrangler action.
#
# Setup sekali (secrets):
#   CLOUDFLARE_API_TOKEN  → token API Cloudflare (scope: Cloudflare Pages Edit)
#   CLOUDFLARE_ACCOUNT_ID → account ID Cloudflare (dashboard → right sidebar)
# ============================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger dari GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_COMULINE_API_URL: "https://api.comuline.com"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .dist --project-name=comuline-web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
